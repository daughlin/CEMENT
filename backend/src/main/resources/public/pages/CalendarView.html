<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Scheduler</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">


</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3">
    <div class="container-fluid">

        <!-- Logo / Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="/calendar">
            <div class="logo-placeholder">C</div>
            <span class="fw-bold">Cement Scheduler</span>
        </a>

        <!-- Mobile toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/search">Search</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/calendar">My Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="openDegreePdf()">Example Schedule</a>
                </li>
            </ul>

            <!-- Profile circle -->
            <div class="profile-circle" title="Profile">
                C
            </div>
        </div>
    </div>
</nav>


<!-- Title -->
<div class="container text-center mb-4">
    <h1 class="fw-bold">My Schedule</h1>
    <button id="downloadPDFBtn" class="btn btn-outline-primary btn-sm" onclick="downloadPDF()">Download PDF</button>
</div>


<div class="container-fluid">
    <div class="row">

        <!-- LEFT: Favorites -->
        <div class="col-2" id="favoritesColumn">
            <div id="favoritesPanel" class="favorites-panel">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Favorites</h5>
                    <button id="toggleFavoritesBtn" class="btn btn-outline-secondary btn-sm" type="button">
                        Hide
                    </button>
                    <br>
                    <br>

                </div>

                <div id="favoritesContent">
                    <div id="favoritesList" class="favorites-list"></div>
                </div>
            </div>
        </div>

        <!-- Middle: Calendar -->
        <div class="col-8" id="calendarColumn">
            <!-- Calendar -->


            <!-- Title -->
            <div class="schedule-card">

                <div class="schedule-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">My Schedule</h3>

                        <button
                                class="btn schedule-btn"
                                onclick="window.location.href='/search'">
                            Back to search
                        </button>
                    </div>
                </div>


                <div class="calendar-wrapper">
                    <div class="row g-3 flex-nowrap">


                        <!-- Monday -->
                        <div class="col day-card">
                            <div class="card shadow-sm h-100" id="M">
                                <div class="card-header text-center fw-semibold">Monday</div>
                                <div class="card-body">
                                    <div class="day-grid" data-day="M"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Tuesday -->
                        <div class="col day-card">
                            <div class="card shadow-sm h-100" id="T">
                                <div class="card-header text-center fw-semibold">Tuesday</div>
                                <div class="card-body">
                                    <div class="day-grid" data-day="T"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Wednesday -->
                        <div class="col day-card">
                            <div class="card shadow-sm h-100" id="W">
                                <div class="card-header text-center fw-semibold">Wednesday</div>
                                <div class="card-body">
                                    <div class="day-grid" data-day="W"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Thursday -->
                        <div class="col day-card">
                            <div class="card shadow-sm h-100" id="R">
                                <div class="card-header text-center fw-semibold">Thursday</div>
                                <div class="card-body">
                                    <div class="day-grid" data-day="R"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Friday -->
                        <div class="col day-card">
                            <div class="card shadow-sm h-100" id="F">
                                <div class="card-header text-center fw-semibold">Friday</div>
                                <div class="card-body">
                                    <div class="day-grid" data-day="F"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Details -->
        <div class="col-2" id="detailsColumn">
            <div id="courseDetailsPanel" class="favorites-panel">
                <h5>Course Details</h5>

                <div id="detailsContentWrapper">
                    <div id="courseDetailsContent" class="text-muted">
                        Click a course in the calendar to view details.
                    </div>

                    <div id="colorPickerSection" class="mb-3" style="display: none;">
                        <strong>Color:</strong>
                        <div class="course-color-picker mt-2">
                            <button class="color-dot" data-color="#8FB78F" style="background-color:#8FB78F;"></button>
                            <button class="color-dot" data-color="#CBE6C7" style="background-color:#CBE6C7;"></button>
                            <button class="color-dot" data-color="#B4CCCF" style="background-color:#B4CCCF;"></button>
                            <button class="color-dot" data-color="#28536B" style="background-color:#28536B;"></button>
                            <button class="color-dot" data-color="#F3A5BC" style="background-color:#F3A5BC;"></button>
                            <button class="color-dot" data-color="#FFC49B" style="background-color:#FFC49B;"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="calendar.js"></script>
<script src="dragDrop.js"></script>
<script src="chat.js"></script>
<script src="degree.js"></script>

</body>
</html>
