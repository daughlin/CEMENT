<body>

<div class="semester-page">
    <div class="semester-card">

        <h1>Welcome</h1>
        <p class="subtitle">Please select your semester and major</p>

        <div class="field">
            <label>Semester</label>
            <select id="semesterSelect">
                <option value="" disabled selected>Loading semesters...</option>
            </select>
        </div>

        <div class="field">
            <label>Major</label>
            <select id="majorSelect">
                <option value="" disabled selected>Loading majors...</option>
            </select>
        </div>

        <button id="continueBtn" class="btn btn-success" disabled>
            Continue
        </button>

    </div>
</div>

</body>

<script>
    function formatSemester(sem) {
        if (!sem.includes("_")) return sem;

        const parts = sem.split("_");
        const year = parts[0];
        const season = parts[1];

        return season + " " + year;
    }

    function checkSelections() {
        const semester = document.getElementById("semesterSelect").value;
        const major = document.getElementById("majorSelect").value;
        const button = document.getElementById("continueBtn");

        button.disabled = !(semester && major);
    }

    async function loadSemesters() {
        const semesterSelect = document.getElementById("semesterSelect");

        try {
            const response = await fetch("/api/semesters");

            if (!response.ok) {
                throw new Error("Failed to fetch semesters");
            }

            const semesters = await response.json();

            semesterSelect.innerHTML = '<option value="" disabled selected>Choose a semester...</option>';

            semesters.forEach(function(sem) {
                const option = document.createElement("option");
                option.value = sem;
                option.textContent = formatSemester(sem);
                semesterSelect.appendChild(option);
            });

        } catch (error) {
            console.error("Semester error:", error);
            semesterSelect.innerHTML = '<option value="" disabled>Error loading semesters</option>';
        }
    }

    async function loadMajors() {
        const majorSelect = document.getElementById("majorSelect");

        try {
            const response = await fetch("/api/majors");

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error("Failed to fetch majors: " + response.status + " " + errorText);
            }

            const majors = await response.json();

            majorSelect.innerHTML = '<option value="" disabled selected>Choose a major...</option>';

            majors.forEach(function(major) {
                const option = document.createElement("option");
                option.value = major;
                option.textContent = major;
                majorSelect.appendChild(option);
            });

        } catch (error) {
            console.error("Major error:", error);
            majorSelect.innerHTML = '<option value="" disabled>Error loading majors</option>';
        }
    }

    document.addEventListener("DOMContentLoaded", async function() {
        await loadSemesters();
        await loadMajors();

        document.getElementById("semesterSelect").addEventListener("change", checkSelections);
        document.getElementById("majorSelect").addEventListener("change", checkSelections);

        document.getElementById("continueBtn").addEventListener("click", function() {
            const semester = document.getElementById("semesterSelect").value;
            const major = document.getElementById("majorSelect").value;

            sessionStorage.setItem("selectedSemester", semester);
            sessionStorage.setItem("selectedMajor", major);

            window.location.href = "/search";
        });
    });
</script>

</body>
