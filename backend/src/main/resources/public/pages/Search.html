<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Search</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3 mb-4">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center gap-2" href="/calendar">
            <div class="logo-placeholder">C</div>
            <span class="fw-bold">Cement Scheduler</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/search">Search</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/calendar">My Schedule</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="openDegreePdf()">Example Schedule</a>
                </li>
            </ul>

            <div class="profile-circle" title="Profile">
                C
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="search-header">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Course Search</h3>

            <button
                    class="btn schedule-btn"
                    onclick="window.location.href='/calendar'">
                Go to schedule
            </button>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label for="searchInput" class="form-label">Search courses</label>
                    <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search courses..."
                    >
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchCourses()">Search</button>
                </div>
            </div>

            <hr class="my-4">

            <div id="filters">
                <div class="row g-3">
                    <div class="col-md-4 col-lg-2">
                        <label for="deptFilter" class="form-label">Department</label>
                        <select id="deptFilter" class="form-select">
                            <option value="">Department</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="profFilter" class="form-label">Professor</label>
                        <select id="profFilter" class="form-select">
                            <option value="">Professor</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="creditsFilter" class="form-label">Credits</label>
                        <select id="creditsFilter" class="form-select">
                            <option value="">Credits</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="startTimeFilter" class="form-label">Starts at/after</label>
                        <input
                                type="time"
                                id="startTimeFilter"
                                class="form-control"
                        >

                        <button
                                type="button"
                                id="clearStartTimeBtn"
                                class="btn btn-outline-secondary btn-sm mt-2"
                        >
                            Clear
                        </button>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="endTimeFilter" class="form-label">Ends before</label>
                        <input
                                type="time"
                                id="endTimeFilter"
                                class="form-control"
                        >

                        <button
                                type="button"
                                id="clearEndTimeBtn"
                                class="btn btn-outline-secondary btn-sm mt-2"
                        >
                            Clear
                        </button>
                    </div>

                    <div class="mt-4">
                        <label class="form-label fw-bold d-block">Major Requirements</label>

                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input majorRequirementFilter" type="checkbox" value="required" id="requiredFilter">
                                <label class="form-check-label" for="requiredFilter">Required for my major</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input majorRequirementFilter" type="checkbox" value="elective" id="electiveFilter">
                                <label class="form-check-label" for="electiveFilter">Major elective</label>
                            </div>
                        </div>
                    </div>

                    <div
                            id="timeValidationMessage"
                            class="text-danger small mt-2 d-none"
                    >
                        End time must come after start time.
                    </div>
                </div>

                <div class="mt-4">
                    <label class="form-label fw-bold d-block">Days</label>

                    <div class="d-flex flex-wrap gap-3">
                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="M" id="dayM">
                            <label class="form-check-label" for="dayM">Monday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="T" id="dayT">
                            <label class="form-check-label" for="dayT">Tuesday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="W" id="dayW">
                            <label class="form-check-label" for="dayW">Wednesday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="R" id="dayR">
                            <label class="form-check-label" for="dayR">Thursday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="F" id="dayF">
                            <label class="form-check-label" for="dayF">Friday</label>
                        </div>
                    </div>

                    <br>

                    <div>
                        <button
                                type="button"
                                id="clearFiltersBtn"
                                class="btn btn-outline-primary"
                        >
                            Clear all filters
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="results" class="d-grid gap-3"></div>

</div>

<script src="chat.js"></script>
<script src="search.js"></script>
<script src="degree.js"></script>

</body>
</html>
