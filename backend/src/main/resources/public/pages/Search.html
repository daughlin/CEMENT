<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Search</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 68px;
            height: 68px;
            border: none;
            border-radius: 50%;
            background: #1f3a5f;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        #chat-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            height: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 2001;
            border: 1px solid #d9dee5;
        }

        .chat-hidden {
            display: none !important;
        }

        #chat-header {
            height: 56px;
            background: #1f3a5f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            font-size: 18px;
            font-weight: 600;
        }

        #chat-close {
            background: transparent;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            background: #f6f8fb;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            max-width: 82%;
            padding: 10px 12px;
            border-radius: 14px;
        }

        .user-message {
            align-self: flex-end;
            background: #dbeafe;
        }

        .bot-message {
            align-self: flex-start;
            background: white;
            border: 1px solid #dbe3ec;
        }

        #chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }

        #chat-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
        }

        #chat-send {
            border: none;
            border-radius: 10px;
            background: #1f3a5f;
            color: white;
            padding: 0 16px;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Course Search</h1>

        <button
                class="btn btn-primary"
                onclick="window.location.href='/calendar'">
            Go to schedule
        </button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label for="searchInput" class="form-label">Search courses</label>
                    <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search courses..."
                    >
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchCourses()">Search</button>
                </div>
            </div>

            <hr class="my-4">

            <div id="filters">
                <div class="row g-3">
                    <div class="col-md-4 col-lg-2">
                        <label for="deptFilter" class="form-label">Department</label>
                        <select id="deptFilter" class="form-select">
                            <option value="">Department</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="profFilter" class="form-label">Professor</label>
                        <select id="profFilter" class="form-select">
                            <option value="">Professor</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="creditsFilter" class="form-label">Credits</label>
                        <select id="creditsFilter" class="form-select">
                            <option value="">Credits</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="startTimeFilter" class="form-label">Starts at/after</label>
                        <input
                                type="time"
                                id="startTimeFilter"
                                class="form-control"
                        >
                        <button
                                type="button"
                                id="clearStartTimeBtn"
                                class="btn btn-outline-secondary btn-sm"
                        >
                            Clear
                        </button>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="endTimeFilter" class="form-label">Ends before</label>
                        <input
                                type="time"
                                id="endTimeFilter"
                                class="form-control"
                        >

                        <button
                                type="button"
                                id="clearEndTimeBtn"
                                class="btn btn-outline-secondary btn-sm"
                        >
                            Clear
                        </button>
                    </div>

                    <div
                            id="timeValidationMessage"
                            class="text-danger small mt-2 d-none"
                    >
                        End time must come after start time.
                    </div>
                </div>

                <div class="mt-4">
                    <label class="form-label fw-bold d-block">Days</label>

                    <div class="d-flex flex-wrap gap-3">
                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="M" id="dayM">
                            <label class="form-check-label" for="dayM">Monday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="T" id="dayT">
                            <label class="form-check-label" for="dayT">Tuesday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="W" id="dayW">
                            <label class="form-check-label" for="dayW">Wednesday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="R" id="dayR">
                            <label class="form-check-label" for="dayR">Thursday</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input dayFilter" type="checkbox" value="F" id="dayF">
                            <label class="form-check-label" for="dayF">Friday</label>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="results" class="d-grid gap-3"></div>

</div>

<!-- CHAT BUTTON -->
<button id="chat-toggle" type="button">Chat</button>

<!-- CHAT WINDOW -->
<div id="chat-window" class="chat-hidden">
    <div id="chat-header">
        <span>CEMENT Assistant</span>
        <button id="chat-close" type="button">&times;</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask about schedules, filters, or courses...">
        <button id="chat-send" type="button">Send</button>
    </div>
</div>

<script src="/search.js"></script>

</body>
</html>
