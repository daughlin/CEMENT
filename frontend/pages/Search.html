<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Search</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        #filters {
            margin-top: 15px;
        }

        #filters select {
            margin-right: 10px;
            padding: 5px;
        }

        #results {
            margin-top: 20px;
        }

        .course {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

<button
        onclick="window.location.href='/calendar'"
        style="position: absolute; top: 20px; right: 20px; padding: 10px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">
    Go to schedule
</button>

<h1>Course Search</h1>

<input
        type="text"
        id="searchInput"
        placeholder="Search courses..."
>

<button onclick="searchCourses()">Search</button>

<div id="filters">

    <select id="deptFilter">
        <option value="">Department</option>
    </select>

    <select id="profFilter">
        <option value="">Professor</option>
    </select>

    <select id="creditsFilter">
        <option value="">Credits</option>
    </select>

    <select id="startTimeFilter">
        <option value="">Starts at/after...</option>
    </select>

    <select id="endTimeFilter">
        <option value="">Ends before...</option>
    </select>

    <br><br>

    <strong>Days:</strong><br>
    <label><input type="checkbox" class="dayFilter" value="M"> Monday</label><br>
    <label><input type="checkbox" class="dayFilter" value="T"> Tuesday</label><br>
    <label><input type="checkbox" class="dayFilter" value="W"> Wednesday</label><br>
    <label><input type="checkbox" class="dayFilter" value="R"> Thursday</label><br>
    <label><input type="checkbox" class="dayFilter" value="F"> Friday</label><br>

</div>

<div id="results"></div>

<script>

    async function loadFilters() {

        const response = await fetch("/api/filters");
        const data = await response.json();

        populateDropdown("deptFilter", data.departments);
        populateDropdown("profFilter", data.professors);
        populateDropdown("creditsFilter", data.credits);

        const interval = 15;

        const minStart = roundDownToInterval(Math.min(...data.startTimes), interval);
        const maxEnd = roundUpToInterval(Math.max(...data.endTimes), interval);

        const timeOptions = buildTimeOptions(minStart, maxEnd, interval);

        populateTimeDropdown("startTimeFilter", timeOptions);
        populateTimeDropdown("endTimeFilter", timeOptions);
    }

    function formatTime(minutes) {

        const h = Math.floor(minutes / 60);
        const m = minutes % 60;

        const hour = h % 12 === 0 ? 12 : h % 12;
        const ampm = h < 12 ? "AM" : "PM";

        return `${hour}:${m.toString().padStart(2, "0")} ${ampm}`;
    }

    function populateDropdown(id, values) {

        const select = document.getElementById(id);

        values.sort();

        values.forEach(v => {

            const option = document.createElement("option");
            option.value = v;
            option.textContent = v;

            select.appendChild(option);

        });
    }

    function populateTimeDropdown(id, values) {

        const select = document.getElementById(id);

        values.forEach(v => {

            const option = document.createElement("option");
            option.value = v; // keep minutes for backend
            option.textContent = formatTime(v); // display readable

            select.appendChild(option);

        });
    }

    function applyFiltersFromUrl() {

        const params = new URLSearchParams(window.location.search);

        const query = params.get("q") || "";
        const dept = params.get("dept") || "";
        const prof = params.get("prof") || "";
        const credits = params.get("credits") || "";
        const startTime = params.get("start") || "";
        const endTime = params.get("end") || "";
        const daysParam = params.get("days") || "";

        document.getElementById("searchInput").value = query;
        document.getElementById("deptFilter").value = dept;
        document.getElementById("profFilter").value = prof;
        document.getElementById("creditsFilter").value = credits;
        document.getElementById("startTimeFilter").value = startTime;
        document.getElementById("endTimeFilter").value = endTime;

        document.querySelectorAll(".dayFilter").forEach(cb => {
            cb.checked = daysParam.includes(cb.value);
        });
    }

    async function searchCourses() {

        const query = document.getElementById("searchInput").value;

        const dept = document.getElementById("deptFilter").value;
        const prof = document.getElementById("profFilter").value;
        const credits = document.getElementById("creditsFilter").value;

        // Get selected days
        const days = Array.from(document.querySelectorAll(".dayFilter:checked"))
            .map(cb => cb.value);

        // Get selected time blocks
        const startTime = document.getElementById("startTimeFilter").value;
        const endTime = document.getElementById("endTimeFilter").value;

        const params = new URLSearchParams({
            q: query,
            dept: dept,
            prof: prof,
            credits: credits,
            days: days.join(""),     // "MWF"
            start: startTime,
            end: endTime
        });

        const response = await fetch(`/api/search?${params}`);

        const courses = await response.json();

        displayResults(courses);
    }

    function displayResults(courses) {

        const resultsDiv = document.getElementById("results");

        resultsDiv.innerHTML = "";

        if (courses.length === 0) {
            resultsDiv.innerHTML = "<p>No courses found</p>";
            return;
        }

        courses.forEach(course => {
            const div = document.createElement("div");
            div.className = "course";

            // Create the button as a DOM element instead of a raw string
            // to avoid quote-nesting issues
            const addButton = document.createElement("button");
            addButton.textContent = "Add course";
            addButton.onclick = () => addCourse(addButton, course);

            div.innerHTML = `
                <strong>${course.courseCode} - ${course.name}</strong> (Section ${course.section})<br>
                Department: ${course.department}<br>
                Professors: ${course.professors.join(", ")}<br>
                Semester: ${course.semester}<br>
                Location: ${course.location}<br>
                Credits: ${course.credits}<br>
                Times: ${course.times.map(t => `${t.day} ${formatTime(t.startTime)}-${formatTime(t.endTime)}`).join(", ")}<br><br>
            `;

            div.appendChild(addButton);
            resultsDiv.appendChild(div);
        });
    }

    async function addCourse(button, course) {
        try {
            const response = await fetch("/api/add-course", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(course)
            });

            if (response.ok) {
                button.textContent = "Added ✓";
                button.style.backgroundColor = "#28a745"; // Success green
                button.disabled = true;
            } else {
                // Read the conflict message sent from the Java catch block
                const errorMsg = await response.text();
                alert("Could not add course:\n" + errorMsg);
            }
        } catch (error) {
            console.error("Network error:", error);
            alert("Server is unreachable.");
        }
    }

    document.querySelectorAll("select")
        .forEach(s => s.addEventListener("change", searchCourses));

    document.querySelectorAll(".dayFilter")
        .forEach(cb => cb.addEventListener("change", searchCourses));

    async function initPage() {
        await loadFilters();
        applyFiltersFromUrl();
        await searchCourses();
    }

    function roundDownToInterval(minutes, interval) {
        return Math.floor(minutes / interval) * interval;
    }

    function roundUpToInterval(minutes, interval) {
        return Math.ceil(minutes / interval) * interval;
    }

    function buildTimeOptions(start, end, interval) {
        const values = [];

        for (let t = start; t <= end; t += interval) {
            values.push(t);
        }

        return values;
    }

    initPage();

</script>

</body>
</html>
