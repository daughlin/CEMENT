<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Scheduler</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .day {
            min-height: 800px;
        }

        .course {
            background: #198754; /* Bootstrap green */
            color: white;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
        }

        .free-slot {
            background: #f8f9fa;
            border: 2px dashed #adb5bd;
            font-size: 12px;
        }

        .day .card-body {
            position: relative;
        }
    </style>
</head>

<body class="bg-light">

<!-- Top bar -->
<div class="container-fluid p-3">
    <button
            onclick="window.location.href='/search'"
            class="btn btn-secondary">
        ← Return to search
    </button>
</div>

<!-- Title -->
<div class="container text-center mb-4">
    <h1 class="fw-bold">My Schedule</h1>
</div>

<!-- Calendar -->
<div class="container">
    <div class="row g-3">

        <div class="col">
            <div class="card day shadow-sm" id="M">
                <div class="card-header text-center fw-semibold">Monday</div>
                <div class="card-body"></div>
            </div>
        </div>

        <div class="col">
            <div class="card day shadow-sm" id="T">
                <div class="card-header text-center fw-semibold">Tuesday</div>
                <div class="card-body"></div>
            </div>
        </div>

        <div class="col">
            <div class="card day shadow-sm" id="W">
                <div class="card-header text-center fw-semibold">Wednesday</div>
                <div class="card-body"></div>
            </div>
        </div>

        <div class="col">
            <div class="card day shadow-sm" id="R">
                <div class="card-header text-center fw-semibold">Thursday</div>
                <div class="card-body"></div>
            </div>
        </div>

        <div class="col">
            <div class="card day shadow-sm" id="F">
                <div class="card-header text-center fw-semibold">Friday</div>
                <div class="card-body"></div>
            </div>
        </div>

    </div>
</div>

<!-- JS -->
<script src="calendar.js"></script>

</body>
</html>
