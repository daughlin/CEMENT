<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Scheduler</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --slot-height: 60px;
            --slots-per-day: 20;
        }

        .calendar-wrapper {
            overflow-x: auto;
        }

        .day-card {
            min-width: 180px;
        }

        .day-card .card-body {
            padding: 0;
        }

        .time-column,
        .day-grid {
            display: grid;
            grid-template-rows: repeat(var(--slots-per-day), var(--slot-height));
            min-height: calc(var(--slots-per-day) * var(--slot-height));
        }

        .time-column {
            width: 80px;
        }

        .time-label {
            border: 1px solid #ced4da;
            font-size: 0.8rem;
            padding: 4px;
            background-color: #f8f9fa;
            text-align: right;
        }

        .day-grid {
            position: relative;
            background-color: white;
            min-height: calc(var(--slots-per-day) * var(--slot-height));
            border: 1px solid #ced4da;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent calc(var(--slot-height) - 1px),
                #ced4da calc(var(--slot-height) - 1px),
                #ced4da var(--slot-height)
            );
        }

        .time-slot {
            min-height: var(--slot-height);
            background-color: transparent;   /* ← IMPORTANT */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-slot.empty-slot:hover {
            background-color: #f8f9fa;
        }

        .add-course-link {
            font-size: 0.75rem;
            text-decoration: none;
            color: #6c757d;
        }

        .course-block {
            background: #198754;
            color: white;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.85rem;
            margin: 2px;
            z-index: 2;
        }
    </style>
</head>

<body class="bg-light">

<!-- Top bar -->
<div class="container-fluid p-3">
    <button
            onclick="window.location.href='/search'"
            class="btn btn-secondary">
        ← Return to search
    </button>
</div>

<!-- Title -->
<div class="container text-center mb-4">
    <h1 class="fw-bold">My Schedule</h1>
    <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- Calendar -->
<div class="container calendar-wrapper">
    <div class="row g-3 flex-nowrap">

        <!-- Time labels column -->
        <div class="col-auto">
            <div class="card shadow-sm border-0">
                <div class="card-header text-center fw-semibold bg-white">Time</div>
                <div class="card-body">
                    <div class="time-column" id="timeColumn">
                        <!-- JS can fill time labels here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Monday -->
        <div class="col day-card">
            <div class="card shadow-sm h-100" id="M">
                <div class="card-header text-center fw-semibold">Monday</div>
                <div class="card-body">
                    <div class="day-grid" data-day="M"></div>
                </div>
            </div>
        </div>

        <!-- Tuesday -->
        <div class="col day-card">
            <div class="card shadow-sm h-100" id="T">
                <div class="card-header text-center fw-semibold">Tuesday</div>
                <div class="card-body">
                    <div class="day-grid" data-day="T"></div>
                </div>
            </div>
        </div>

        <!-- Wednesday -->
        <div class="col day-card">
            <div class="card shadow-sm h-100" id="W">
                <div class="card-header text-center fw-semibold">Wednesday</div>
                <div class="card-body">
                    <div class="day-grid" data-day="W"></div>
                </div>
            </div>
        </div>

        <!-- Thursday -->
        <div class="col day-card">
            <div class="card shadow-sm h-100" id="R">
                <div class="card-header text-center fw-semibold">Thursday</div>
                <div class="card-body">
                    <div class="day-grid" data-day="R"></div>
                </div>
            </div>
        </div>

        <!-- Friday -->
        <div class="col day-card">
            <div class="card shadow-sm h-100" id="F">
                <div class="card-header text-center fw-semibold">Friday</div>
                <div class="card-body">
                    <div class="day-grid" data-day="F"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- JS -->
<script src="calendar.js"></script>

</body>
</html>
